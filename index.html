<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KruFoo Physics Lab</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    left:40px;
    bottom:40px;
    width:320px;
}

label{
    font-size:22px;
}

input{
    width:100%;
}

#value{
    font-size:26px;
    font-weight:bold;
}
</style>

</head>

<body>

<canvas id="c"></canvas>

<div id="ui">
<label>
มุมเอียง
<div id="value">θ = 20°</div>
<input id="angle" type="range" min="0" max="90" value="20">
</label>
</div>


<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

const slider=document.getElementById("angle");
const value=document.getElementById("value");


function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

window.onresize=resize;
resize();



function arrow(x1,y1,x2,y2){

    ctx.strokeStyle="#d60000";
    ctx.fillStyle="#d60000";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();


    let a=Math.atan2(y2-y1,x2-x1);


    ctx.beginPath();

    ctx.moveTo(x2,y2);

    ctx.lineTo(
        x2-15*Math.cos(a-Math.PI/6),
        y2-15*Math.sin(a-Math.PI/6)
    );

    ctx.lineTo(
        x2-15*Math.cos(a+Math.PI/6),
        y2-15*Math.sin(a+Math.PI/6)
    );

    ctx.closePath();
    ctx.fill();
}



function draw(){

ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
);


let deg=Number(slider.value);
let theta=deg*Math.PI/180;

value.innerHTML="θ = "+deg+"°";


// จุดหมุนซ้าย

let pivotX=180;
let pivotY=canvas.height*0.75;


// ความยาวพื้น

let planeLength=350;


// ปลายพื้น

let endX=
pivotX+planeLength*Math.cos(theta);

let endY=
pivotY-planeLength*Math.sin(theta);



// ---------------------
// พื้นเอียง
// ---------------------

ctx.strokeStyle="#666";
ctx.lineWidth=8;

ctx.beginPath();

ctx.moveTo(
pivotX,
pivotY
);

ctx.lineTo(
endX,
endY
);

ctx.stroke();



// ---------------------
// กล่องบนพื้น
// ---------------------

let boxDistance=200;


let bx=
pivotX+boxDistance*Math.cos(theta);

let by=
pivotY-boxDistance*Math.sin(theta);



ctx.save();

ctx.translate(
bx,
by
);

ctx.rotate(-theta);


ctx.fillStyle="#2f80ed";

ctx.fillRect(
-25,
-45,
50,
45
);



// ---------------------
// mg sin(theta)
// ---------------------

let L=180*Math.sin(theta);


// ขนานพื้นเอียง
// ชี้ลงตามพื้นเอียง

arrow(
-L*Math.cos(theta),
-22+L*Math.sin(theta),
0,
-22
);



ctx.fillStyle="#d60000";
ctx.font="24px sans-serif";


ctx.fillText(
"mg sinθ",
-L/2-40,
30
);


ctx.restore();



// ---------------------
// มุม theta
// ---------------------

ctx.strokeStyle="#000";
ctx.lineWidth=3;


ctx.beginPath();

ctx.arc(
pivotX,
pivotY,
70,
0,
-theta,
true
);

ctx.stroke();



ctx.fillStyle="#000";
ctx.font="26px sans-serif";


ctx.fillText(
deg+"°",
pivotX+85*Math.cos(theta/2),
pivotY-85*Math.sin(theta/2)
);



// จุดหมุน

ctx.beginPath();

ctx.arc(
pivotX,
pivotY,
8,
0,
Math.PI*2
);

ctx.fill();



requestAnimationFrame(draw);

}


draw();

</script>

</body>
</html>
