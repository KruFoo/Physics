<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KruFoo Physics Lab</title>

<style>

html,body{
    margin:0;
    overflow:hidden;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:fixed;
    left:25px;
    bottom:40px;
    width:260px;
}

label{
    font-size:18px;
}

input{
    width:100%;
    margin-top:5px;
}

#value{
    font-size:22px;
    font-weight:bold;
}

</style>

</head>


<body>

<canvas id="c"></canvas>


<div id="ui">
<label>

<div id="value">
มุมเอียง θ = 20°
</div>

<input id="angle" type="range" min="0" max="90" value="20">

</label>
</div>



<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

const slider=document.getElementById("angle");
const value=document.getElementById("value");



function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

window.onresize=resize;
resize();




function arrow(x1,y1,x2,y2){

ctx.strokeStyle="#d60000";
ctx.fillStyle="#d60000";
ctx.lineWidth=Math.max(3,planeLength*0.014);


ctx.beginPath();

ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);

ctx.stroke();



let a=Math.atan2(y2-y1,x2-x1);


ctx.beginPath();

ctx.moveTo(x2,y2);


ctx.lineTo(
x2-15*Math.cos(a-Math.PI/6),
y2-15*Math.sin(a-Math.PI/6)
);


ctx.lineTo(
x2-15*Math.cos(a+Math.PI/6),
y2-15*Math.sin(a+Math.PI/6)
);


ctx.closePath();

ctx.fill();

}




function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// ย้ายภาพลงล่าง

ctx.save();


// Responsive positioning
ctx.translate(
canvas.width*0.03,
canvas.height*0.03
);


// no fixed scaling



let deg=Number(slider.value);

let theta=deg*Math.PI/180;


value.innerHTML=
"มุมเอียง θ = "+deg+"°";




// จุดหมุนซ้ายล่าง

let pivotX=canvas.width*0.12;

let pivotY=canvas.height*0.82;




let planeLength=canvas.width*0.42;



let endX=
pivotX+planeLength*Math.cos(theta);


let endY=
pivotY-planeLength*Math.sin(theta);





// ----------------
// พื้นเอียง
// ----------------


ctx.fillStyle="#bdbdbd";


ctx.beginPath();


ctx.moveTo(
pivotX,
pivotY
);


ctx.lineTo(
endX,
endY
);


ctx.lineTo(
endX,
pivotY
);


ctx.closePath();


ctx.fill();





ctx.strokeStyle="#000";

ctx.lineWidth=4;


ctx.beginPath();


ctx.moveTo(
pivotX,
pivotY
);


ctx.lineTo(
endX,
endY
);


ctx.stroke();






// ----------------
// กล่อง
// ----------------


let boxDistance=planeLength*0.57;


let bx=
pivotX+boxDistance*Math.cos(theta);


let by=
pivotY-boxDistance*Math.sin(theta);



ctx.save();


ctx.translate(
bx,
by
);


ctx.rotate(-theta);


ctx.fillStyle="#2f80ed";


ctx.fillRect(
-25,
-45,
50,
45
);


ctx.restore();





// ----------------
// center of mass
// ----------------


let cmOffset=planeLength*0.064;


let startX=
bx-cmOffset*Math.sin(theta);


let startY=
by-cmOffset*Math.cos(theta);



// ----------------
// mg sin theta
// ----------------

if(deg > 0){

let L =
planeLength*0.52*Math.sin(theta);


let finishX =
startX-L*Math.cos(theta);


let finishY =
startY+L*Math.sin(theta);



arrow(
startX,
startY,
finishX,
finishY
);



// label mg sin theta

ctx.save();


ctx.translate(
(startX+finishX)/2,
(startY+finishY)/2
);


ctx.rotate(-theta);


ctx.fillStyle="#d60000";

ctx.font=`${Math.round(planeLength*0.07)}px sans-serif`;


ctx.fillText(
"mg sinθ",
-45,
-15
);


ctx.restore();

}




// ----------------
// มุม θ
// ----------------
if (deg>0) {

ctx.strokeStyle="#000";

ctx.lineWidth=4;


ctx.beginPath();


ctx.moveTo(
pivotX,
pivotY
);


ctx.lineTo(
endX,
endY
);


ctx.stroke();ctx.strokeStyle="#000";

ctx.lineWidth=3;


ctx.beginPath();


ctx.arc(
pivotX,
pivotY,
70,
0,
-theta,
true
);


ctx.stroke();



ctx.fillStyle="#000";

ctx.font=`${Math.round(planeLength*0.085)}px sans-serif`;


ctx.fillText(
"θ",
pivotX+85*Math.cos(theta/2),
pivotY-85*Math.sin(theta/2)
);
}


ctx.restore();



requestAnimationFrame(draw);

}



draw();


</script>

</body>
</html>
